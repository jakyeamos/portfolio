<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shot Clip Timing Review</title>
    <style>
      :root {
        color: #151820;
        background: #f7f2e9;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        padding: 24px;
      }

      main {
        display: grid;
        gap: 16px;
        max-width: 980px;
      }

      form {
        align-items: end;
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(4, minmax(0, 1fr)) auto;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      input {
        border: 1px solid #c9bda9;
        font: inherit;
        padding: 10px;
      }

      button {
        background: #b50d0d;
        border: 0;
        color: white;
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.08em;
        padding: 12px 16px;
        text-transform: uppercase;
      }

      iframe {
        aspect-ratio: 16 / 9;
        background: #151820;
        border: 0;
        width: min(100%, 900px);
      }

      code {
        background: white;
        border: 1px solid #e0d5c2;
        display: block;
        overflow-wrap: anywhere;
        padding: 12px;
      }

      a {
        color: #b50d0d;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Shot Clip Timing Review</h1>
      <form id="clip-form">
        <label>
          YouTube ID
          <input id="video-id" value="XxSr2nArxkA" />
        </label>
        <label>
          Start
          <input id="start" inputmode="numeric" type="number" value="91" />
        </label>
        <label>
          End
          <input id="end" inputmode="numeric" type="number" value="124" />
        </label>
        <label>
          Muted
          <input id="muted" type="checkbox" checked />
        </label>
        <button type="submit">Load Clip</button>
      </form>
      <iframe
        id="player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
        title="Shot timing review player"
      ></iframe>
      <a id="watch-link" target="_blank" rel="noreferrer">Open watch page</a>
      <code id="url"></code>
    </main>
    <script>
      const form = document.getElementById('clip-form');
      const player = document.getElementById('player');
      const output = document.getElementById('url');
      const watchLink = document.getElementById('watch-link');
      const initialParams = new URLSearchParams(window.location.search);
      const videoIdInput = document.getElementById('video-id');
      const startInput = document.getElementById('start');
      const endInput = document.getElementById('end');
      const mutedInput = document.getElementById('muted');

      if (initialParams.has('id')) videoIdInput.value = initialParams.get('id');
      if (initialParams.has('start')) startInput.value = initialParams.get('start');
      if (initialParams.has('end')) endInput.value = initialParams.get('end');
      if (initialParams.get('muted') === '0') mutedInput.checked = false;

      function buildUrl() {
        const params = new URLSearchParams({
          autoplay: '1',
          controls: '1',
          disablekb: '0',
          end: endInput.value,
          fs: '1',
          iv_load_policy: '3',
          playsinline: '1',
          rel: '0',
          start: startInput.value,
        });

        if (mutedInput.checked) params.set('mute', '1');

        return `https://www.youtube.com/embed/${videoIdInput.value}?${params.toString()}`;
      }

      function loadClip() {
        const url = buildUrl();
        player.src = url;
        output.textContent = url;
        watchLink.href = `https://www.youtube.com/watch?v=${videoIdInput.value}&t=${startInput.value}s`;
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        loadClip();
      });

      loadClip();
    </script>
  </body>
</html>

name: Portfolio Quality Gates

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run architecture boundary check
        run: pnpm architecture:check

      - name: Run environment contract check
        run: pnpm environment:check

      - name: Run format check
        run: pnpm format:check

      - name: Run secret scan
        run: pnpm secret:scan

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run content checks
        run: pnpm test:content

      - name: Build
        run: pnpm build

      - name: Confirm verification is read-only
        run: git diff --exit-code

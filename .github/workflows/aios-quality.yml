name: AIOS Quality Gates

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AIOS architecture check
        run: node scripts/aios-architecture-check.mjs

      - name: npm run lint
        run: npm run lint

      - name: npm run build
        run: npm run build

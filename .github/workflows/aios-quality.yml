name: AIOS Quality Gates

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run AIOS architecture check
        run: node scripts/aios-architecture-check.mjs

      - name: pnpm lint
        run: pnpm lint

      - name: pnpm test:content
        run: pnpm test:content

      - name: pnpm build
        run: pnpm build

      - name: Confirm verification is read-only
        run: git diff --exit-code
